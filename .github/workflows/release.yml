name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name wingwy-media-editor wingwy_media_editor.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wingwy-media-editor
          path: dist/wingwy-media-editor.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "发布 $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/wingwy-media-editor.exe --clobber
          else
            gh release create "$TAG" dist/wingwy-media-editor.exe \
              --title "wingwy音视频剪辑器 $TAG" \
              --generate-notes
          fi
